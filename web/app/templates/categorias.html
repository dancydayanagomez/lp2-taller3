{% extends "base.html" %}

{% block titulo %}Categorías - Tienda Virtual{% endblock %}

{% block contenido %}
<div class="lista-categorias">
    <h2>Categorías</h2>

    <ul>
        {% for categoria in categorias %}
            <li>
                <a href="{{ url_for('routes.index', categoria=categoria.id) }}">
                    {{ categoria.nombre }}
                </a>
            </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
